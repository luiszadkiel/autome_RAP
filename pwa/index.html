<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Cayacoa Golf - Acceso Rápido</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏌️</text></svg>">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 32px;
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            font-size: 64px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        h1 {
            color: #059669;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }
        
        /* Loading Screen */
        .loading-screen {
            text-align: center;
            display: none;
        }
        
        .loading-screen.active {
            display: block;
        }
        
        .spinner {
            border: 5px solid #f0fdf4;
            border-top: 5px solid #10b981;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            color: #059669;
            font-size: 15px;
            font-weight: 600;
            margin: 16px 0;
        }
        
        /* Login Form */
        .login-form {
            display: none;
        }
        
        .login-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        
        .checkbox-group label {
            margin: 0;
            font-size: 14px;
            text-transform: none;
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .info-box {
            background: #f0f9ff;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #0ea5e9;
            margin: 20px 0;
        }
        
        .info-row {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
            color: #334155;
        }
        
        .info-icon {
            font-size: 20px;
            margin-right: 10px;
            min-width: 28px;
        }
        
        .saved-info {
            background: #f0fdf4;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            margin-bottom: 16px;
            font-size: 13px;
            color: #059669;
        }
        
        .logout-btn {
            background: #ef4444;
            margin-top: 12px;
            font-size: 14px;
            padding: 12px;
        }
        
        .note {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏌️</div>
        <h1>Cayacoa Golf Club</h1>
        <p class="subtitle" id="subtitle">Acceso Rápido a Reservas</p>
        
        <!-- Loading Screen -->
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <div class="status" id="loadingStatus">Preparando acceso...</div>
        </div>
        
        <!-- Login Form -->
        <div class="login-form" id="loginForm">
            <div id="reservationInfo"></div>
            
            <div id="savedCredentials"></div>
            
            <form id="credentialsForm">
                <div class="form-group">
                    <label for="email">📧 Email / Usuario</label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        autocomplete="username"
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">🔑 Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Recordar mis credenciales</label>
                </div>
                
                <button type="submit" id="submitBtn">
                    🚀 Guardar y Acceder
                </button>
                
                <button type="button" class="logout-btn" id="logoutBtn" style="display: none;">
                    🗑️ Borrar Credenciales
                </button>
            </form>
            
            <p class="note">
                Tus credenciales se guardan de forma segura en tu dispositivo.
            </p>
        </div>
    </div>

    <script>
        // Configuración
        const CAYACOA_BASE = 'https://app.cayacoagolf.com';
        const LOGIN_URL = `${CAYACOA_BASE}/front-end/login`;
        
        // Elementos del DOM
        const loadingScreen = document.getElementById('loadingScreen');
        const loginForm = document.getElementById('loginForm');
        const credentialsForm = document.getElementById('credentialsForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember');
        const submitBtn = document.getElementById('submitBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loadingStatus = document.getElementById('loadingStatus');
        const subtitle = document.getElementById('subtitle');
        const reservationInfo = document.getElementById('reservationInfo');
        const savedCredentials = document.getElementById('savedCredentials');
        
        // Parsear parámetros de URL
        const urlParams = new URLSearchParams(window.location.search);
        const bookingParam = urlParams.get('booking');
        const redirectParam = urlParams.get('redirect');
        
        let targetUrl = null;
        
        // Construir URL de destino
        if (bookingParam) {
            targetUrl = `${CAYACOA_BASE}/front-end/make-booking/${bookingParam}`;
            
            // Extraer información de la reserva del parámetro
            const match = bookingParam.match(/(\d{1,2})(\d{2})(am|pm)\/(\d{2})(\d{2})(\d{4})/);
            if (match) {
                const hour = match[1];
                const minute = match[2];
                const meridian = match[3].toUpperCase();
                const day = match[4];
                const month = match[5];
                const year = match[6];
                
                const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                const monthName = monthNames[parseInt(month) - 1];
                
                reservationInfo.innerHTML = `
                    <div class="info-box">
                        <div class="info-row">
                            <span class="info-icon">📅</span>
                            <span><strong>${day} ${monthName} ${year}</strong></span>
                        </div>
                        <div class="info-row">
                            <span class="info-icon">⏰</span>
                            <span><strong>${hour}:${minute} ${meridian}</strong></span>
                        </div>
                    </div>
                `;
            }
        } else if (redirectParam) {
            targetUrl = `${CAYACOA_BASE}${redirectParam}`;
        } else {
            targetUrl = `${CAYACOA_BASE}/front-end/tee-time`;
        }
        
        console.log('🎯 URL destino:', targetUrl);
        
        // Cargar credenciales guardadas
        function loadSavedCredentials() {
            const savedEmail = localStorage.getItem('cayacoa_email');
            const savedPassword = localStorage.getItem('cayacoa_password');
            
            if (savedEmail && savedPassword) {
                emailInput.value = savedEmail;
                passwordInput.value = savedPassword;
                logoutBtn.style.display = 'block';
                
                savedCredentials.innerHTML = `
                    <div class="saved-info">
                        ✅ Credenciales guardadas: <strong>${savedEmail}</strong>
                    </div>
                `;
                
                return { email: savedEmail, password: savedPassword };
            }
            
            return null;
        }
        
        // Guardar credenciales
        function saveCredentials(email, password) {
            if (rememberCheckbox.checked) {
                localStorage.setItem('cayacoa_email', email);
                localStorage.setItem('cayacoa_password', password);
                console.log('✅ Credenciales guardadas');
            }
        }
        
        // Borrar credenciales
        function clearCredentials() {
            localStorage.removeItem('cayacoa_email');
            localStorage.removeItem('cayacoa_password');
            emailInput.value = '';
            passwordInput.value = '';
            savedCredentials.innerHTML = '';
            logoutBtn.style.display = 'none';
            console.log('🗑️ Credenciales borradas');
        }
        
        // Auto-login
        function autoLogin(email, password) {
            console.log('🚀 Iniciando auto-login...');
            
            showLoading('Preparando acceso automático...');
            
            // Construir URL con credenciales
            const loginWithParams = `${LOGIN_URL}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&redirect=${encodeURIComponent(targetUrl)}`;
            
            // Guardar para después
            sessionStorage.setItem('cayacoa_target_after_login', targetUrl);
            
            setTimeout(() => {
                console.log('📍 Redirigiendo a login con credenciales...');
                window.location.href = loginWithParams;
            }, 1500);
        }
        
        // Mostrar loading
        function showLoading(message) {
            loadingStatus.textContent = message;
            loadingScreen.classList.add('active');
            loginForm.classList.remove('active');
        }
        
        // Mostrar form
        function showForm() {
            loadingScreen.classList.remove('active');
            loginForm.classList.add('active');
        }
        
        // Form submit
        credentialsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                alert('Por favor ingresa email y contraseña');
                return;
            }
            
            // Guardar si está marcado
            saveCredentials(email, password);
            
            // Hacer login
            autoLogin(email, password);
        });
        
        // Logout button
        logoutBtn.addEventListener('click', () => {
            if (confirm('¿Borrar tus credenciales guardadas?')) {
                clearCredentials();
            }
        });
        
        // Inicializar
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🏌️ Cayacoa PWA Iniciada');
            console.log('🎯 Target:', targetUrl);
            
            // Verificar si venimos de login exitoso
            const afterLogin = sessionStorage.getItem('cayacoa_target_after_login');
            if (afterLogin && window.location.href.includes('front-end') && !window.location.href.includes('login')) {
                // Ya estamos logueados, limpiar y continuar
                sessionStorage.removeItem('cayacoa_target_after_login');
                console.log('✅ Login exitoso, ya en página destino');
                return;
            }
            
            // Cargar credenciales guardadas
            const saved = loadSavedCredentials();
            
            if (saved) {
                // Tiene credenciales guardadas, auto-login
                subtitle.textContent = 'Acceso automático activado';
                autoLogin(saved.email, saved.password);
            } else {
                // No tiene credenciales, mostrar form
                subtitle.textContent = 'Ingresa tus credenciales de Cayacoa';
                showForm();
            }
        });
        
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Error SW:', err));
        }
    </script>
</body>
</html>
